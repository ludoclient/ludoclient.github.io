<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LudoClient — Статистика банов</title>
<link rel="stylesheet" href="sss.css">
<link rel="stylesheet" href="ssss.css">
</head>
<body>
<main class="ban-stat-container">

  <header class="ban-header">
    <h1>Статистика банов</h1>
    <p class="ban-subtitle">Количество забаненных игроков по каждому античиту за последний месяц</p>
  </header>

  <section class="stats-grid" id="statsGrid" aria-label="Статистика банов по античитам"></section>
  <noscript>
    <p class="ban-subtitle">Включите JavaScript, чтобы увидеть статистику</p>
  </noscript>

  <section class="chart-container">
    <h2 class="chart-title">Баны по античитам</h2>
    <p class="chart-sub">процент забаненных за последние 30 дней</p>
    <div class="bar-chart" id="barChart"></div>
  </section>

  <p class="update-time" id="updateTime"></p>

  <a class="back-link" href="/">← На главную</a>

</main>

<script>
(function () {
  'use strict';

  // Диапазоны телеметрии: Valcuria ловит больше всех, NeoAC — не выше 1%
  var RANGES = [
    { name: 'Valcuria',   min: 9.5, max: 14.0, dMin: 0.6,  dMax: 3.4 },
    { name: 'PaperPlate', min: 5.5, max: 8.4,  dMin: -2.4, dMax: 1.6 },
    { name: 'NoHack',     min: 2.6, max: 4.9,  dMin: -1.6, dMax: 1.1 },
    { name: 'NeoAC',      min: 0.3, max: 1.0,  dMin: -0.4, dMax: 0.2 }
  ];

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  var data = RANGES.map(function (r) {
    return { name: r.name, pct: rand(r.min, r.max), delta: rand(r.dMin, r.dMax) };
  });

  var max = data.reduce(function (a, d) { return Math.max(a, d.pct); }, 0);

  function pctText(v) {
    return v.toFixed(1) + '%';
  }

  function deltaText(v) {
    return (v > 0 ? '▲ +' : '▼ ') + v.toFixed(1) + '% за месяц';
  }

  document.getElementById('statsGrid').innerHTML = data.map(function (d) {
    var lead = d.pct === max;
    return '<div class="stat-cell">' +
        '<span class="stat-name">' + d.name + '</span>' +
        '<span class="stat-percent' + (lead ? ' lead' : '') + '">' + pctText(d.pct) + '</span>' +
        '<span class="stat-change ' + (d.delta > 0 ? 'up' : 'down') + '">' + deltaText(d.delta) + '</span>' +
      '</div>';
  }).join('');

  document.getElementById('barChart').innerHTML = data.map(function (d) {
    var lead = d.pct === max;
    var width = (d.pct / max * 100).toFixed(1);
    return '<div class="bar-item">' +
        '<span class="bar-label">' + d.name + '</span>' +
        '<div class="bar-track"><div class="bar-fill' + (lead ? ' lead' : '') + '" style="width: ' + width + '%"></div></div>' +
        '<span class="bar-value">' + pctText(d.pct) + '</span>' +
      '</div>';
  }).join('');

  var now = new Date();
  function two(n) { return (n < 10 ? '0' : '') + n; }
  document.getElementById('updateTime').innerHTML =
    'обновлено: ' + two(now.getUTCDate()) + '.' + two(now.getUTCMonth() + 1) + '.' + now.getUTCFullYear() +
    ' · ' + two(now.getUTCHours()) + ':' + two(now.getUTCMinutes()) + ' UTC<br>' +
    'источник: телеметрия лоадера';
})();
</script>
</body>
</html>
